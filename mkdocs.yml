site_name: PolyLaue
site_description: Documentation for PolyLaue, a tool for identifying and tracking crystals in multigrain Laue diffraction scans.
site_url: https://polylaue.github.io
repo_url: https://github.com/PolyLaue/PolyLaue
repo_name: PolyLaue/PolyLaue
edit_uri: ""
copyright: Copyright &copy; 2026 UChicago Argonne, LLC

theme:
  name: material
  logo: img/logo.png
  favicon: img/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
      - Projects, Sections, and Series: projects.md
      - Viewing Data: viewing.md
      - Identifying and Tracking Crystals: identification.md
      - Picking Points: point-picking.md
      - Predicted Reflections: reflections.md
      - Mapping: mapping.md
      - Saving and Loading Data: saving-data.md
  - Reference:
      - Algorithms for Indexing and Tracking: algorithms.md
      - Calibrating Detector Geometry: calibration.md
      - Adding New Structure Types: structure-types.md
      - References: references.md
